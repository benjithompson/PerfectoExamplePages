<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TN3270 Host Emulator</title>
  <style>
    /* ── OS / Window Chrome ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #008080; /* classic Win32 teal desktop */
      font-family: 'Courier New', Courier, monospace;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    /* Application window */
    #appWindow {
      display: flex; flex-direction: column;
      border: 2px solid #dfdfdf;
      border-right-color: #404040; border-bottom-color: #404040;
      box-shadow: 2px 2px 0 #000, inset 1px 1px 0 #fff;
      background: #c0c0c0;
      min-width: 760px;
    }

    /* Title bar */
    #titleBar {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: #fff;
      font-size: 12px; font-weight: bold;
      padding: 3px 4px;
      display: flex; align-items: center; gap: 6px;
      cursor: default;
    }
    #titleBar .title-icon {
      width: 16px; height: 16px;
      background: #c0c0c0;
      border: 1px solid #404040;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; color: #000; flex-shrink: 0;
    }
    #titleBar .title-text { flex: 1; }
    .win-btn {
      width: 16px; height: 14px;
      background: #c0c0c0;
      border: 1px solid #dfdfdf;
      border-right-color: #404040; border-bottom-color: #404040;
      font-size: 9px; font-weight: bold; color: #000;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }
    .win-btn:active { border-color: #404040; border-right-color: #dfdfdf; border-bottom-color: #dfdfdf; }

    /* Menu bar */
    #menuBar {
      background: #c0c0c0;
      border-bottom: 1px solid #808080;
      padding: 1px 2px;
      display: flex; gap: 0;
      font-size: 12px; color: #000;
    }
    .menu-item {
      padding: 2px 8px;
      cursor: pointer;
    }
    .menu-item:hover { background: #000080; color: #fff; }

    /* Toolbar */
    #toolbar {
      background: #c0c0c0;
      border-bottom: 1px solid #808080;
      padding: 2px 4px;
      display: flex; align-items: center; gap: 4px;
      font-size: 11px;
    }
    .tb-btn {
      padding: 2px 6px;
      background: #c0c0c0;
      border: 1px solid #dfdfdf;
      border-right-color: #404040; border-bottom-color: #404040;
      font-size: 11px; font-family: 'Courier New', monospace;
      cursor: pointer; color: #000;
    }
    .tb-btn:active { border-color: #404040; border-right-color: #dfdfdf; border-bottom-color: #dfdfdf; }
    .tb-sep { width: 1px; height: 18px; background: #808080; margin: 0 2px; }

    /* Terminal screen area */
    #screenArea {
      background: #000;
      padding: 4px 6px;
      line-height: 1;
      position: relative;
      flex: 1;
    }

    /* 3270 screen: 24 rows × 80 cols */
    #screen {
      width: 640px; /* 80 chars × 8px */
      height: 384px; /* 24 rows × 16px */
      position: relative;
      overflow: hidden;
    }

    .row {
      height: 16px;
      display: flex;
      white-space: pre;
    }

    .cell {
      width: 8px; height: 16px;
      font-size: 13px;
      line-height: 16px;
      display: inline-block;
      color: #33ff33; /* green phosphor */
      text-align: center;
      position: relative;
    }

    /* Field types */
    .cell.protected { color: #33ff33; }
    .cell.input { color: #ffffff; background: #004400; }
    .cell.input.active { background: #006600; }
    .cell.cursor { background: #33ff33 !important; color: #000 !important; }
    .cell.high-intensity { color: #ffffff; }
    .cell.dim { color: #1a7a1a; }
    .cell.cyan { color: #33ffff; }
    .cell.yellow { color: #ffff00; }
    .cell.red { color: #ff4444; }
    .cell.pink { color: #ff88ff; }

    /* Blinking cursor */
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .cell.cursor { animation: blink 1s step-end infinite; }

    /* Status bar at bottom of terminal */
    #oemStatus {
      background: #000;
      border-top: 1px solid #333;
      color: #33ff33;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      padding: 2px 6px;
      display: flex; gap: 20px;
    }
    #oemStatus span { display: inline-block; }

    /* Win32 status bar at very bottom */
    #statusBar {
      background: #c0c0c0;
      border-top: 1px solid #dfdfdf;
      padding: 2px 6px;
      font-size: 11px;
      color: #000;
      display: flex; gap: 0;
    }
    .status-pane {
      padding: 1px 8px;
      border: 1px solid #808080;
      border-top-color: #404040; border-left-color: #404040;
      margin-right: 3px;
      font-size: 11px;
    }
  </style>
</head>
<body>

<div id="appWindow">
  <!-- Title Bar -->
  <div id="titleBar">
    <div class="title-icon">📟</div>
    <span class="title-text">IBM 3270 Terminal Emulator - [BANKPROD:BKAPP1  LU002]</span>
    <div class="win-btn" title="Minimize">_</div>
    <div class="win-btn" title="Maximize">□</div>
    <div class="win-btn" title="Close" onclick="window.history.back()" style="font-size:11px;">✕</div>
  </div>

  <!-- Menu Bar -->
  <div id="menuBar">
    <div class="menu-item">File</div>
    <div class="menu-item">Edit</div>
    <div class="menu-item">View</div>
    <div class="menu-item">Options</div>
    <div class="menu-item">Session</div>
    <div class="menu-item">Help</div>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="tb-btn" onclick="term.pressKey('enter')" title="Enter (transmit)">Enter</button>
    <button class="tb-btn" onclick="term.pressKey('clear')" title="Clear screen">Clear</button>
    <button class="tb-btn" onclick="term.pressKey('pf1')" title="PF1">F1</button>
    <button class="tb-btn" onclick="term.pressKey('pf3')" title="PF3">F3</button>
    <button class="tb-btn" onclick="term.pressKey('pf12')" title="PF12">F12</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="term.pressKey('tab')" title="Tab">Tab</button>
    <button class="tb-btn" onclick="term.pressKey('backtab')" title="Back Tab">BackTab</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="term.pressKey('pa1')" title="PA1">PA1</button>
    <button class="tb-btn" onclick="term.pressKey('pa2')" title="PA2">PA2</button>
    <div class="tb-sep"></div>
    <span style="font-size:11px;color:#444;padding:0 4px;">Session: BANKPROD</span>
  </div>

  <!-- Screen Area -->
  <div id="screenArea">
    <div id="screen"></div>

    <!-- OEM-style status line (inside terminal area) -->
    <div id="oemStatus">
      <span id="statusMode">4 A</span>
      <span id="statusConn">BANKPROD</span>
      <span id="statusLu">LU002</span>
      <span id="statusPos">Row: 01  Col: 01</span>
      <span id="statusMsg" style="flex:1;text-align:right;"></span>
    </div>
  </div>

  <!-- Win32 Status Bar -->
  <div id="statusBar">
    <div class="status-pane" id="sbConnection">Connected: BANKPROD (10.0.0.1:23)</div>
    <div class="status-pane" id="sbModel">Model 2 (80x24)</div>
    <div class="status-pane" id="sbCaps">NUM</div>
    <div class="status-pane" style="margin-left:auto;" id="sbTime"></div>
  </div>
</div>

<script>
(function() {
  const ROWS = 24, COLS = 80;

  /* ── Screen buffer ── */
  // Each cell: { ch, type, fieldId }
  // type: 'protected' | 'input' | 'high' | 'dim' | 'cyan' | 'yellow' | 'red' | 'pink'
  const buf = Array.from({length: ROWS}, () =>
    Array.from({length: COLS}, () => ({ ch: ' ', type: 'protected', fieldId: -1 }))
  );

  const fields = []; // { id, row, col, len, value, label }
  let cursorRow = 0, cursorCol = 0;
  let currentFieldIdx = -1;
  let state = 'signon'; // app state machine

  const screenEl = document.getElementById('screen');
  const statusMsgEl = document.getElementById('statusMsg');
  const statusPosEl = document.getElementById('statusPos');

  /* ── Build DOM grid ── */
  const cellEls = [];
  for (let r = 0; r < ROWS; r++) {
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    const rowCells = [];
    for (let c = 0; c < COLS; c++) {
      const cel = document.createElement('span');
      cel.className = 'cell protected';
      cel.textContent = ' ';
      rowEl.appendChild(cel);
      rowCells.push(cel);
    }
    screenEl.appendChild(rowEl);
    cellEls.push(rowCells);
  }

  /* ── Helpers ── */
  function clearBuf() {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        buf[r][c] = { ch: ' ', type: 'protected', fieldId: -1 };
    fields.length = 0;
  }

  function put(row, col, text, type = 'protected') {
    for (let i = 0; i < text.length; i++) {
      if (col + i >= COLS) break;
      buf[row][col + i] = { ch: text[i], type, fieldId: -1 };
    }
  }

  function makeField(row, col, len, id) {
    for (let i = 0; i < len; i++) {
      if (col + i >= COLS) break;
      buf[row][col + i] = { ch: '_', type: 'input', fieldId: id };
    }
    fields.push({ id, row, col, len, value: '' });
  }

  function setFieldValue(id, val) {
    const f = fields.find(x => x.id === id);
    if (!f) return;
    f.value = val;
    const padded = val.padEnd(f.len, '_').substring(0, f.len);
    for (let i = 0; i < f.len; i++) {
      buf[f.row][f.col + i].ch = padded[i];
    }
  }

  function getFieldValue(id) {
    const f = fields.find(x => x.id === id);
    return f ? f.value.trim() : '';
  }

  function render() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = buf[r][c];
        const el = cellEls[r][c];
        el.textContent = cell.ch === '_' && cell.type === 'input' ? ' ' : cell.ch;
        el.className = 'cell ' + cell.type;
        if (cell.type === 'input') {
          el.style.borderBottom = '1px solid #33ff33';
          el.style.background = '#001800';
        } else {
          el.style.borderBottom = '';
          el.style.background = '';
        }
      }
    }
    // draw cursor
    if (cursorRow < ROWS && cursorCol < COLS) {
      cellEls[cursorRow][cursorCol].classList.add('cursor');
    }
    statusPosEl.textContent = `Row: ${String(cursorRow+1).padStart(2,'0')}  Col: ${String(cursorCol+1).padStart(2,'0')}`;
  }

  function showMessage(msg, type) {
    statusMsgEl.textContent = msg;
    statusMsgEl.style.color = type === 'error' ? '#ff4444' : type === 'ok' ? '#33ff33' : '#ffff00';
  }
  function clearMessage() { statusMsgEl.textContent = ''; }

  /* ── Move cursor to first input field ── */
  function gotoFirstField() {
    if (fields.length === 0) return;
    currentFieldIdx = 0;
    const f = fields[currentFieldIdx];
    cursorRow = f.row; cursorCol = f.col;
  }

  function gotoField(idx) {
    if (fields.length === 0) return;
    currentFieldIdx = ((idx % fields.length) + fields.length) % fields.length;
    const f = fields[currentFieldIdx];
    cursorRow = f.row; cursorCol = f.col;
  }

  function currentField() {
    return fields[currentFieldIdx] || null;
  }

  /* ── Type a character into current field ── */
  function typeChar(ch) {
    const f = currentField();
    if (!f) return;
    if (f.value.length < f.len) {
      f.value += ch;
      setFieldValue(f.id, f.value);
      // advance cursor within field
      const pos = f.col + f.value.length;
      if (pos < f.col + f.len) {
        cursorCol = pos;
      } else {
        cursorCol = f.col + f.len - 1;
      }
    }
    render();
  }

  function backspace() {
    const f = currentField();
    if (!f) return;
    if (f.value.length > 0) {
      f.value = f.value.slice(0, -1);
      setFieldValue(f.id, f.value);
      cursorCol = f.col + f.value.length;
    }
    render();
  }

  /* ══════════════════════════════════════════
     SCREENS
  ══════════════════════════════════════════ */

  function drawSignon() {
    state = 'signon';
    clearBuf();

    // Header
    put(0,  0, '═'.repeat(80), 'cyan');
    put(1,  0, '                      FIRST NATIONAL BANK CORPORATION', 'high');
    put(2,  0, '                       ONLINE BANKING SYSTEM  v4.2.1', 'protected');
    put(3,  0, '═'.repeat(80), 'cyan');

    put(5,  0, '  SIGNON TO MAINFRAME APPLICATION', 'high');
    put(6,  0, '  ─────────────────────────────────────────────────────', 'dim');

    put(9,  4, 'USERID   :', 'protected');
    put(11, 4, 'PASSWORD :', 'protected');

    makeField(9,  15, 20, 'userid');
    makeField(11, 15, 20, 'password');

    put(14, 4, 'Press ENTER to sign on.   Press F3 to exit.', 'dim');
    put(15, 4, 'Press F1 for HELP.', 'dim');

    put(17, 0, '  ─────────────────────────────────────────────────────', 'dim');
    put(18, 4, 'AUTHORIZED USE ONLY - ALL ACTIVITY IS MONITORED AND LOGGED', 'red');
    put(19, 4, 'Unauthorized access is prohibited and subject to prosecution.', 'dim');

    put(22, 0, '─'.repeat(80), 'dim');
    put(23, 0, ' F1=HELP  F3=EXIT  F12=CANCEL', 'cyan');

    document.getElementById('statusMode').textContent = '4 A';
    showMessage('Enter your USERID and PASSWORD to continue.', 'info');
    gotoFirstField();
    render();
  }

  function drawMainMenu(username) {
    state = 'mainmenu';
    clearBuf();

    const now = new Date();
    const dateStr = now.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'});
    const timeStr = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});

    put(0,  0, '═'.repeat(80), 'cyan');
    put(1,  0, '        FIRST NATIONAL BANK - CUSTOMER ACCOUNT MANAGEMENT SYSTEM', 'high');
    put(2,  0, `        DATE: ${dateStr}                     TIME: ${timeStr}`, 'protected');
    put(3,  0, '═'.repeat(80), 'cyan');

    put(4,  0, ` WELCOME, ${username.toUpperCase().padEnd(20)}`, 'yellow');
    put(5,  0, '─'.repeat(80), 'dim');

    put(7,  4, 'MAIN MENU', 'high');
    put(8,  4, '─────────────────────────────────────────────', 'dim');

    const opts = [
      ['1', 'ACCOUNT INQUIRY'],
      ['2', 'FUND TRANSFER'],
      ['3', 'BILL PAYMENT'],
      ['4', 'TRANSACTION HISTORY'],
      ['5', 'ACCOUNT PROFILE'],
      ['6', 'LOAN INFORMATION'],
      ['7', 'WIRE TRANSFER'],
      ['8', 'SECURE MESSAGING'],
      ['9', 'CHANGE PASSWORD'],
    ];
    opts.forEach(([n, label], i) => {
      put(10 + i, 8, `${n}.`, 'yellow');
      put(10 + i, 12, label, 'protected');
    });

    put(20, 4, 'OPTION  ==>', 'protected');
    makeField(20, 16, 2, 'menu_option');

    put(21, 4, 'ENTER OPTION NUMBER AND PRESS ENTER.', 'dim');
    put(22, 0, '─'.repeat(80), 'dim');
    put(23, 0, ' F1=HELP  F3=SIGNOFF  F12=CANCEL', 'cyan');

    document.getElementById('statusMode').textContent = '4 A';
    showMessage(`Signon successful. Welcome ${username.toUpperCase()}.`, 'ok');
    gotoFirstField();
    render();
  }

  function drawAccountInquiry() {
    state = 'accounts';
    clearBuf();

    put(0,  0, '═'.repeat(80), 'cyan');
    put(1,  0, '        FIRST NATIONAL BANK - ACCOUNT INQUIRY', 'high');
    put(2,  0, '        CUSTOMER: JOHN Q SMITH                  CIF: 00847293', 'protected');
    put(3,  0, '═'.repeat(80), 'cyan');

    put(5,  0, ' SEL  ACCOUNT NUMBER    TYPE              BALANCE        STATUS', 'high');
    put(6,  0, ' ─── ─────────────── ─────────────── ──────────────── ────────', 'dim');

    const accounts = [
      [' _  ', '****-****-4821', 'CHECKING         ', '      $4,218.33 ', 'ACTIVE'],
      [' _  ', '****-****-9047', 'SAVINGS          ', '     $12,500.00 ', 'ACTIVE'],
      [' _  ', '****-****-2233', 'MONEY MARKET     ', '     $35,000.00 ', 'ACTIVE'],
      [' _  ', '****-****-7761', 'CREDIT CARD      ', '     ($1,234.56)', 'ACTIVE'],
      [' _  ', '****-****-0012', 'HOME EQUITY LINE ', '          $0.00 ', 'CLOSED'],
    ];

    accounts.forEach(([sel, acct, type, bal, status], i) => {
      put(7 + i, 1,  sel,    'input');
      put(7 + i, 5,  acct,   'protected');
      put(7 + i, 22, type,   'protected');
      put(7 + i, 39, bal,    'yellow');
      put(7 + i, 56, status, i < 4 ? 'protected' : 'dim');
    });

    // Make sel fields
    for (let i = 0; i < 5; i++) {
      makeField(7 + i, 2, 1, `acct_sel_${i}`);
    }

    put(14, 0, '─'.repeat(80), 'dim');
    put(15, 2, 'ENTER S=SELECT ACCOUNT FOR DETAIL   D=DOWNLOAD STATEMENT', 'dim');

    put(17, 2, 'ACCOUNT ==>', 'protected');
    makeField(17, 14, 16, 'acct_num');
    put(18, 2, 'ENTER FULL ACCOUNT NUMBER OR SELECT ABOVE.', 'dim');

    put(20, 0, '─'.repeat(80), 'dim');
    put(21, 0, ' TOTAL ASSETS:    $51,718.33    TOTAL LIABILITIES:   ($1,234.56)', 'high');
    put(22, 0, '─'.repeat(80), 'dim');
    put(23, 0, ' F1=HELP  F3=BACK  F5=REFRESH  F7=PREV  F8=NEXT  F12=CANCEL', 'cyan');

    showMessage('Account list retrieved. Select an account or enter account number.', 'info');
    gotoFirstField();
    render();
  }

  function drawTransactionHistory() {
    state = 'txhist';
    clearBuf();

    put(0,  0, '═'.repeat(80), 'cyan');
    put(1,  0, '        FIRST NATIONAL BANK - TRANSACTION HISTORY', 'high');
    put(2,  0, '        ACCOUNT: ****-****-4821 (CHECKING)       AVAILABLE: $4,218.33', 'protected');
    put(3,  0, '═'.repeat(80), 'cyan');

    put(5,  0, ' DATE       DESCRIPTION                          AMOUNT        BALANCE', 'high');
    put(6,  0, ' ────────── ──────────────────────────────────── ───────────── ───────────', 'dim');

    const txns = [
      ['05/30/2025', 'DIRECT DEPOSIT - PAYROLL          ', '  +$3,200.00', ' $4,218.33'],
      ['05/29/2025', 'AMAZON.COM MARKETPLACE            ', '    -$47.99 ', ' $1,018.33'],
      ['05/28/2025', 'ATM WITHDRAWAL - MAIN ST          ', '   -$200.00 ', ' $1,066.32'],
      ['05/27/2025', 'NETFLIX SUBSCRIPTION              ', '    -$15.99 ', ' $1,266.32'],
      ['05/26/2025', 'UTILITY PAYMENT - GAS CO          ', '   -$124.56 ', ' $1,282.31'],
      ['05/25/2025', 'WHOLE FOODS MARKET #284           ', '    -$67.23 ', ' $1,406.87'],
      ['05/24/2025', 'VENMO PAYMENT - FRIENDS           ', '    -$50.00 ', ' $1,474.10'],
      ['05/23/2025', 'TRANSFER FROM SAVINGS             ', '   +$500.00 ', ' $1,524.10'],
      ['05/22/2025', 'CHECK #1042 - LANDLORD            ', '$-1,500.00  ', ' $1,024.10'],
      ['05/21/2025', 'SHELL OIL 004527                  ', '    -$65.00 ', ' $2,524.10'],
    ];

    txns.forEach(([dt, desc, amt, bal], i) => {
      put(7 + i, 1,  dt,   'protected');
      put(7 + i, 12, desc, 'protected');
      put(7 + i, 47, amt,  amt.includes('+') ? 'protected' : 'dim');
      put(7 + i, 60, bal,  'yellow');
    });

    put(18, 0, '─'.repeat(80), 'dim');
    put(19, 2, 'SHOWING RECORDS 1-10 OF 127.  USE F7/F8 TO SCROLL.', 'dim');

    put(21, 2, 'DATE RANGE: FROM', 'protected');
    makeField(21, 19, 10, 'from_date');
    put(21, 30, ' TO ', 'protected');
    makeField(21, 34, 10, 'to_date');

    put(22, 0, '─'.repeat(80), 'dim');
    put(23, 0, ' F1=HELP  F3=BACK  F5=REFRESH  F7=UP  F8=DOWN  F10=PRINT  F12=CANCEL', 'cyan');

    showMessage('Transaction history for checking account. F7/F8 to scroll.', 'info');
    gotoFirstField();
    render();
  }

  function drawBillPayment() {
    state = 'billpay';
    clearBuf();

    put(0,  0, '═'.repeat(80), 'cyan');
    put(1,  0, '        FIRST NATIONAL BANK - BILL PAYMENT CENTER', 'high');
    put(2,  0, '        PAY FROM: ****-****-4821 (CHECKING)   BALANCE: $4,218.33', 'protected');
    put(3,  0, '═'.repeat(80), 'cyan');

    put(5,  2, 'PAYEE NAME       :', 'protected');
    makeField(5, 22, 30, 'payee');

    put(7,  2, 'ACCOUNT NUMBER   :', 'protected');
    makeField(7, 22, 20, 'payee_acct');

    put(9,  2, 'PAYMENT AMOUNT   :', 'protected');
    put(9,  22,'$', 'protected');
    makeField(9, 23, 10, 'pay_amount');

    put(11, 2, 'PAYMENT DATE     :', 'protected');
    makeField(11, 22, 10, 'pay_date');
    put(11, 33, '(MM/DD/YYYY)', 'dim');

    put(13, 2, 'MEMO             :', 'protected');
    makeField(13, 22, 30, 'pay_memo');

    put(15, 2, 'CONFIRMATION EMAIL:', 'protected');
    makeField(15, 22, 30, 'pay_email');

    put(17, 0, '─'.repeat(80), 'dim');
    put(18, 2, '*** SCHEDULED PAYMENTS ***', 'high');
    put(19, 4, 'ELECTRIC COMPANY     DUE: 06/05/2025    AMT: $142.33', 'dim');
    put(20, 4, 'INTERNET PROVIDER    DUE: 06/12/2025    AMT:  $79.99', 'dim');

    put(22, 0, '─'.repeat(80), 'dim');
    put(23, 0, ' F1=HELP  F3=BACK  F6=SUBMIT  F9=SCHEDULED  F12=CANCEL', 'cyan');

    showMessage('Enter payee information and press F6 to submit payment.', 'info');
    gotoFirstField();
    render();
  }

  function drawHelp() {
    state = 'help';
    clearBuf();

    put(0,  0, '═'.repeat(80), 'cyan');
    put(1,  0, '        FIRST NATIONAL BANK - HELP CENTER', 'high');
    put(2,  0, '        ONLINE BANKING SYSTEM KEYBOARD REFERENCE', 'protected');
    put(3,  0, '═'.repeat(80), 'cyan');

    put(5,  2, 'FUNCTION KEY ASSIGNMENTS:', 'high');
    put(6,  2, '─────────────────────────────────────────────────────────────', 'dim');

    const keys = [
      ['F1  ', 'HELP        - Display context-sensitive help'],
      ['F2  ', 'SEARCH      - Search/filter current list'],
      ['F3  ', 'EXIT/BACK   - Return to previous screen or sign off'],
      ['F4  ', 'PROMPT      - Display valid values for current field'],
      ['F5  ', 'REFRESH     - Refresh current screen data'],
      ['F6  ', 'SUBMIT      - Submit/execute current transaction'],
      ['F7  ', 'SCROLL UP   - Scroll backward through list'],
      ['F8  ', 'SCROLL DOWN - Scroll forward through list'],
      ['F9  ', 'RETRIEVE    - Retrieve previous command'],
      ['F10 ', 'PRINT       - Print current screen'],
      ['F11 ', 'SAVE        - Save current record'],
      ['F12 ', 'CANCEL      - Cancel current operation (no save)'],
      ['PA1 ', 'ATTENTION   - Interrupt current operation'],
      ['PA2 ', 'RESET       - Reset keyboard from error state'],
    ];

    keys.forEach(([k, desc], i) => {
      put(7 + i, 4,  k,    'yellow');
      put(7 + i, 10, desc, 'protected');
    });

    put(22, 0, '─'.repeat(80), 'dim');
    put(23, 0, ' F3=BACK  F12=CANCEL                                  PG 1 OF 1', 'cyan');

    document.getElementById('statusMode').textContent = 'HELP';
    showMessage('Press F3 to return to previous screen.', 'info');
    gotoFirstField();
    render();
  }

  function drawError(msg) {
    showMessage('*** ' + msg + ' ***', 'error');
    document.getElementById('statusMode').textContent = 'X []';
    render();
  }

  function drawFundTransfer() {
    state = 'transfer';
    clearBuf();

    put(0,  0, '═'.repeat(80), 'cyan');
    put(1,  0, '        FIRST NATIONAL BANK - FUND TRANSFER', 'high');
    put(2,  0, '        INTERNAL AND EXTERNAL ACCOUNT TRANSFERS', 'protected');
    put(3,  0, '═'.repeat(80), 'cyan');

    put(5,  2, 'TRANSFER TYPE    :', 'protected');
    put(5, 22, '1=INTERNAL  2=EXTERNAL WIRE  3=ACH', 'dim');
    makeField(5, 21, 1, 'xfer_type');

    put(7,  2, 'FROM ACCOUNT     :', 'protected');
    makeField(7, 22, 20, 'xfer_from');

    put(9,  2, 'TO ACCOUNT       :', 'protected');
    makeField(9, 22, 20, 'xfer_to');

    put(11, 2, 'AMOUNT           :', 'protected');
    put(11, 22,'$', 'protected');
    makeField(11, 23, 12, 'xfer_amt');

    put(13, 2, 'EFFECTIVE DATE   :', 'protected');
    makeField(13, 22, 10, 'xfer_date');
    put(13, 33, '(MM/DD/YYYY OR PRESS ENTER FOR TODAY)', 'dim');

    put(15, 2, 'DESCRIPTION      :', 'protected');
    makeField(15, 22, 30, 'xfer_desc');

    put(17, 0, '─'.repeat(80), 'dim');
    put(18, 2, 'DAILY TRANSFER LIMIT: $10,000.00    TRANSFERS TODAY: $0.00', 'protected');
    put(19, 2, 'REMAINING LIMIT:      $10,000.00', 'yellow');

    put(21, 2, '*** CONFIRM BEFORE SUBMITTING.  TRANSFERS ARE IMMEDIATE. ***', 'red');
    put(22, 0, '─'.repeat(80), 'dim');
    put(23, 0, ' F1=HELP  F3=BACK  F6=CONFIRM  F9=SCHEDULED  F12=CANCEL', 'cyan');

    showMessage('Enter transfer details. Press F6 to confirm transfer.', 'info');
    gotoFirstField();
    render();
  }

  /* ── Previous screen stack ── */
  const screenStack = [];

  function pushScreen(fn) {
    screenStack.push(state);
    fn();
  }

  function popScreen() {
    const prev = screenStack.pop();
    if (!prev) { drawSignon(); return; }
    switch(prev) {
      case 'mainmenu':   drawMainMenu(currentUser); break;
      case 'signon':     drawSignon(); break;
      case 'accounts':   drawAccountInquiry(); break;
      case 'txhist':     drawTransactionHistory(); break;
      case 'billpay':    drawBillPayment(); break;
      case 'transfer':   drawFundTransfer(); break;
      default:           drawMainMenu(currentUser);
    }
  }

  let currentUser = '';

  /* ── Input handling ── */
  function handleEnter() {
    clearMessage();
    switch (state) {
      case 'signon': {
        const uid = getFieldValue('userid');
        const pwd = getFieldValue('password');
        if (!uid) { drawError('USERID IS REQUIRED'); return; }
        if (!pwd) { drawError('PASSWORD IS REQUIRED'); return; }
        if (pwd.length < 4) { drawError('PASSWORD MUST BE AT LEAST 4 CHARACTERS'); return; }
        currentUser = uid;
        screenStack.length = 0;
        drawMainMenu(uid);
        break;
      }
      case 'mainmenu': {
        const opt = getFieldValue('menu_option').trim();
        switch (opt) {
          case '1': pushScreen(drawAccountInquiry); break;
          case '2': pushScreen(drawFundTransfer); break;
          case '3': pushScreen(drawBillPayment); break;
          case '4': pushScreen(drawTransactionHistory); break;
          case '5': showMessage('FEATURE NOT YET AVAILABLE IN THIS RELEASE.', 'error'); break;
          case '6': showMessage('LOAN INFORMATION MODULE - COMING SOON.', 'error'); break;
          case '7': pushScreen(drawFundTransfer); break;
          case '8': showMessage('SECURE MESSAGING - CONTACT YOUR BRANCH.', 'error'); break;
          case '9': showMessage('CHANGE PASSWORD - CONTACT YOUR BRANCH ADMINISTRATOR.', 'error'); break;
          default:  drawError('INVALID OPTION - ENTER 1-9'); return;
        }
        break;
      }
      case 'billpay': {
        const payee = getFieldValue('payee');
        const amt = getFieldValue('pay_amount');
        if (!payee) { drawError('PAYEE NAME REQUIRED'); return; }
        if (!amt) { drawError('PAYMENT AMOUNT REQUIRED'); return; }
        showMessage(`PAYMENT SCHEDULED: $${amt} TO ${payee.toUpperCase()}. CONFIRMATION #BPY${Math.floor(Math.random()*900000+100000)}`, 'ok');
        break;
      }
      case 'transfer': {
        const from = getFieldValue('xfer_from');
        const to   = getFieldValue('xfer_to');
        const amt  = getFieldValue('xfer_amt');
        if (!from || !to) { drawError('FROM AND TO ACCOUNTS ARE REQUIRED'); return; }
        if (!amt) { drawError('TRANSFER AMOUNT IS REQUIRED'); return; }
        showMessage(`TRANSFER SUBMITTED. CONFIRMATION #XFR${Math.floor(Math.random()*900000+100000)}`, 'ok');
        break;
      }
      default: break;
    }
  }

  /* ── PF/Function key handling ── */
  const term = {
    pressKey(key) {
      switch(key) {
        case 'enter':  handleEnter(); break;
        case 'clear':  clearBuf(); render(); showMessage('SCREEN CLEARED', 'info'); break;
        case 'pf1':    pushScreen(drawHelp); break;
        case 'pf3':
          if (state === 'signon') return;
          if (state === 'mainmenu') { drawSignon(); return; }
          popScreen();
          break;
        case 'pf5':    showMessage('REFRESHING...', 'info'); render(); break;
        case 'pf6':    handleEnter(); break;
        case 'pf12':
          if (state !== 'signon' && state !== 'mainmenu') popScreen();
          else showMessage('CANNOT CANCEL FROM THIS SCREEN. USE F3 TO EXIT.', 'error');
          break;
        case 'tab':
          if (fields.length > 0) gotoField(currentFieldIdx + 1);
          render(); break;
        case 'backtab':
          if (fields.length > 0) gotoField(currentFieldIdx - 1);
          render(); break;
        case 'pa1':    showMessage('ATTENTION KEY PRESSED.', 'info'); break;
        case 'pa2':    document.getElementById('statusMode').textContent = '4 A'; clearMessage(); render(); break;
      }
    }
  };
  window.term = term;

  /* ── Keyboard capture ── */
  document.addEventListener('keydown', e => {
    // Allow default for non-character keys where needed
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

    switch (e.key) {
      case 'Enter':   e.preventDefault(); handleEnter(); break;
      case 'Tab':     e.preventDefault(); term.pressKey(e.shiftKey ? 'backtab' : 'tab'); break;
      case 'Backspace': e.preventDefault(); backspace(); break;
      case 'F1':      e.preventDefault(); term.pressKey('pf1'); break;
      case 'F3':      e.preventDefault(); term.pressKey('pf3'); break;
      case 'F5':      e.preventDefault(); term.pressKey('pf5'); break;
      case 'F6':      e.preventDefault(); term.pressKey('pf6'); break;
      case 'F12':     e.preventDefault(); term.pressKey('pf12'); break;
      default:
        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault();
          typeChar(e.key.toUpperCase());
        }
    }
  });

  /* ── Clock ── */
  function updateClock() {
    const now = new Date();
    document.getElementById('sbTime').textContent =
      now.toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  }
  setInterval(updateClock, 1000);
  updateClock();

  /* ── Boot ── */
  drawSignon();

})();
</script>
</body>
</html>
